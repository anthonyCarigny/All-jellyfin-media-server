services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - 3000:3000
    volumes:
      - ${COMMON_PATH}/configs/homepage/config:/app/config
      - ${COMMON_PATH}/configs/homepage/images:/app/images
      - ${COMMON_PATH}/configs/homepage/icons:/app/icons
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
      - HOMEPAGE_VAR_SERVER_IP=${SERVER_IP}
      - HOMEPAGE_ALLOWED_HOSTS=${SERVER_IP}:3000,localhost:3000,${SERVER_IP}
      - HOMEPAGE_VAR_JELLYFIN_KEY=${JELLYFIN_KEY}
      - HOMEPAGE_VAR_JELLYSEER_API_KEY=${JELLYSEER_API_KEY}
      - HOMEPAGE_VAR_PROWLARR_KEY=${PROWLARR_KEY}
      - HOMEPAGE_VAR_JACKETT_API_KEY=${JACKETT_API_KEY}
      - HOMEPAGE_VAR_SONARR_KEY=${SONARR_KEY}
      - HOMEPAGE_VAR_RADARR_KEY=${RADARR_KEY}
      - HOMEPAGE_VAR_QBIT_TEMP_PASS=${QBIT_TEMP_PASS}
      - HOMEPAGE_VAR_BAZARR_KEY=${BAZARR_KEY}
    restart: unless-stopped